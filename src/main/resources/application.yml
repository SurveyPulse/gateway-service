server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: user-login
          uri: http://localhost:8081
          predicates:
            - Path=/login

        - id: survey-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/surveys/**

        - id: response-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/responses/**

        - id: report-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/reports/**
